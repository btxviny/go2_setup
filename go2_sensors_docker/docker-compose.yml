services:
  sensors:
    image: go2-sensors-humble
    container_name: go2-sensors-humble
    restart: unless-stopped
    network_mode: host   # required for ROS2/DDS discovery to work with the rest of the Go2 network
    privileged: true      # simplest reliable way to give librealsense USB access to the D435i
    volumes:
      - /dev:/dev
      - ./start.sh:/start.sh:ro
      - ./config:/config:ro
      - ~/rosbags:/rosbags
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=0   # matches the robot's DDS domain (see AGENTS.md) -- change if you want it isolated
      # Defaults to config/cyclonedds_ethernet.xml (pins eth0, caps
      # MaxMessageSize/FragmentSize under the 1500B Ethernet MTU -- see that
      # file's comment for why: CycloneDDS's own MaxMessageSize default is
      # 14720B, ~10x the real MTU, causing IP fragmentation that's fragile
      # for large messages like /rslidar_points and raw RealSense images).
      # launch_all_sensors_docker.sh --wifi overrides this to the static,
      # checked-in config/cyclonedds_wifi.xml (pins wlan0, same
      # MaxMessageSize/FragmentSize tuning, plain multicast discovery -- no
      # unicast peers needed; see that file's comment and
      # docs/networking.md for why the earlier per-run-generated
      # unicast-peer version turned out to be unnecessary).
      - CYCLONEDDS_URI=${CONTAINER_CYCLONEDDS_URI:-file:///config/cyclonedds_ethernet.xml}
    command: ["bash", "/start.sh"]
