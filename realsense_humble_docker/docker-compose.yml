services:
  realsense:
    image: go2-realsense-humble
    container_name: go2-realsense-humble
    restart: unless-stopped
    network_mode: host   # required for ROS2/DDS discovery to work with the rest of the Go2 network
    privileged: true      # simplest reliable way to give librealsense USB access to the D435i
    volumes:
      - /dev:/dev
      - ./start.sh:/start.sh:ro
      - ~/rosbags:/rosbags
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=0   # matches the robot's DDS domain (see AGENTS.md) -- change if you want it isolated
    command: ["bash", "/start.sh"]
